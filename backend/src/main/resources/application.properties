# =============================================================================
# InterviewPrep AI - Spring Boot Application Configuration (Default: MySQL)
# =============================================================================
spring.application.name=InterviewPrep AI Backend
server.port=8080

# -----------------------------------------------------------------------------
# Database Configuration (MySQL 8+)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:interviewprep_ai}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# JWT Security Configuration
# -----------------------------------------------------------------------------
# Minimum 256-bit secret key for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------------------------------------
# Python AI Microservice Integration
# -----------------------------------------------------------------------------
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service.connect-timeout-ms=5000
app.ai-service.read-timeout-ms=20000

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.interviewprep=INFO
logging.level.org.springframework.security=WARN
